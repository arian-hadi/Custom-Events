{% extends 'base.html' %}
{% load static %}
{% block content %}
  <div class="max-w-2xl mx-auto p-4 bg-white rounded shadow">
    <h1 class="text-2xl font-bold mb-4">{{ announcement.title }}</h1>
    {% if announcement.image %}
      <img src="{{ announcement.image.url }}" alt="Image" class="w-full mb-4 rounded">
    {% endif %}
    <p>{{ announcement.message }}</p>
  </div>
{% endblock %}
