services:
  web:
    build: .
    container_name: staging_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn prime_project.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "8001:8000"  # Different port: 8001 instead of 8000
    env_file:
      - .env  # Uses .env in staging directory
    depends_on:
      - db
    restart: unless-stopped
    volumes:
      - static_volume_staging:/app/staticfiles
      - media_volume_staging:/app/mediafiles

  nginx:
    image: nginx:alpine
    container_name: staging_nginx
    ports:
      - "8080:80"    # HTTP on port 8080 (production uses 80)
      - "8443:443"   # HTTPS on port 8443 (production uses 443)
    volumes:
      - ./nginx.staging.conf:/etc/nginx/conf.d/default.conf
      - static_volume_staging:/app/staticfiles
      - media_volume_staging:/app/mediafiles
    depends_on:
      - web
    restart: unless-stopped

  db:
    image: postgres:14
    container_name: staging_db
    restart: always
    ports:
      - "5433:5432"  # Different port for database (production uses default 5432)
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data/
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

volumes:
  postgres_data_staging:      # Separate database volume
  static_volume_staging:      # Separate static files volume
  media_volume_staging:       # Separate media files volume

networks:
  default:
    name: staging_network

