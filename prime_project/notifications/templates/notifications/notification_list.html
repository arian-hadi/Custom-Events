{% extends 'base.html' %}

{% block title %}All Notifications - Event Platform{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-4 sm:py-8 max-w-6xl">
    <div class="bg-white rounded-xl shadow-lg border border-gray-100">
        <div class="p-4 sm:p-6 border-b border-gray-200">
            <div class="flex flex-col gap-4">
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                    <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 flex items-center gap-2">
                        <i class="fas fa-bell text-indigo-600"></i>
                        All Notifications
                        {% if unread_count > 0 %}
                        <span class="ml-2 px-2 sm:px-3 py-1 bg-red-500 text-white text-xs sm:text-sm font-bold rounded-full">
                            {{ unread_count }} unread
                        </span>
                        {% endif %}
                    </h1>
                    <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2 w-full sm:w-auto">
                        <a href="{% url 'dashboard:user_dashboard' %}" class="px-4 py-2 text-sm font-medium text-gray-700 hover:text-indigo-600 transition-colors border border-gray-300 rounded-lg hover:bg-gray-50 text-center">
                            <i class="fas fa-arrow-left mr-1"></i>Back to Dashboard
                        </a>
                        <button onclick="markAllNotificationsRead()" class="px-4 py-2 text-sm font-medium text-gray-700 hover:text-indigo-600 transition-colors border border-gray-300 rounded-lg hover:bg-gray-50">
                            <i class="fas fa-check-double mr-1"></i>Mark all as read
                        </button>
                        <button onclick="loadNotifications()" class="px-4 py-2 text-sm font-medium text-indigo-600 hover:text-indigo-700 transition-colors border border-indigo-300 rounded-lg hover:bg-indigo-50">
                            <i class="fas fa-sync-alt mr-1"></i>Refresh
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="p-4 sm:p-6">
            <div id="notifications-container" class="space-y-4">
                <div class="flex items-center justify-center py-12">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div>
                    <span class="ml-3 text-gray-600">Loading notifications...</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

function formatDate(dateString) {
    const date = new Date(dateString);
    const now = new Date();
    const diffMs = now - date;
    const diffMins = Math.floor(diffMs / 60000);
    const diffHours = Math.floor(diffMs / 3600000);
    const diffDays = Math.floor(diffMs / 86400000);
    
    if (diffMins < 1) return 'Just now';
    if (diffMins < 60) return `${diffMins} minute${diffMins > 1 ? 's' : ''} ago`;
    if (diffHours < 24) return `${diffHours} hour${diffHours > 1 ? 's' : ''} ago`;
    if (diffDays < 7) return `${diffDays} day${diffDays > 1 ? 's' : ''} ago`;
    
    return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function getNotificationIcon(type) {
    const icons = {
        'application_approved': 'fa-check-circle text-green-500',
        'application_disapproved': 'fa-times-circle text-red-500',
        'ranking_updated': 'fa-trophy text-yellow-500',
        'edit_of_week_daily': 'fa-chart-line text-blue-500',
        'title_unlocked': 'fa-star text-purple-500',
        'edit_verified': 'fa-check text-green-500',
        'edit_rejected': 'fa-times text-red-500',
    };
    return icons[type] || 'fa-bell text-gray-500';
}

function loadNotifications() {
    const container = document.getElementById('notifications-container');
    container.innerHTML = '<div class="flex items-center justify-center py-12"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div><span class="ml-3 text-gray-600">Loading notifications...</span></div>';
    
    fetch('{% url "notifications:notification_list" %}')
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                renderNotifications(data.notifications);
            } else {
                container.innerHTML = '<p class="text-gray-500 text-center py-8">Error loading notifications</p>';
            }
        })
        .catch(error => {
            console.error('Error loading notifications:', error);
            container.innerHTML = '<p class="text-red-500 text-center py-8">Error loading notifications. Please try again.</p>';
        });
}

function renderNotifications(notifications) {
    const container = document.getElementById('notifications-container');
    
    if (notifications.length === 0) {
        container.innerHTML = '<p class="text-gray-500 text-center py-12">No notifications yet. You\'ll see updates here when they arrive!</p>';
        return;
    }
    
    let html = '';
    notifications.forEach(notification => {
        const iconClass = getNotificationIcon(notification.notification_type);
        const readClass = notification.is_read ? 'bg-gray-50' : 'bg-blue-50 border-l-4 border-indigo-500';
        
        html += `
            <div class="notification-item ${readClass} rounded-lg p-4 border border-gray-200 hover:shadow-md transition-all" data-notification-id="${notification.id}">
                <div class="flex items-start gap-3 sm:gap-4">
                    <div class="flex-shrink-0 mt-1">
                        <i class="fas ${iconClass} text-lg sm:text-xl"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-start justify-between gap-2 mb-1">
                            <h3 class="font-semibold text-gray-900 text-sm sm:text-base ${notification.is_read ? '' : 'font-bold'}">${notification.title}</h3>
                            <div class="flex items-center gap-2 flex-shrink-0">
                                <span class="text-xs text-gray-500 hidden sm:inline">${formatDate(notification.created_at)}</span>
                                ${!notification.is_read ? '<span class="w-2 h-2 bg-indigo-500 rounded-full"></span>' : ''}
                            </div>
                        </div>
                        <span class="text-xs text-gray-500 sm:hidden block mb-2">${formatDate(notification.created_at)}</span>
                        <p class="text-sm text-gray-700 mt-1 whitespace-pre-line">${notification.message}</p>
                        <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2 mt-3 pt-3 border-t border-gray-200">
                            ${!notification.is_read ? `<button onclick="markNotificationRead(${notification.id})" class="text-xs sm:text-sm text-indigo-600 hover:text-indigo-800 font-medium px-3 py-1.5 border border-indigo-300 rounded hover:bg-indigo-50 text-center">Mark as read</button>` : ''}
                            <button onclick="deleteNotification(${notification.id})" class="text-xs sm:text-sm text-red-600 hover:text-red-800 font-medium px-3 py-1.5 border border-red-300 rounded hover:bg-red-50 text-center">Delete</button>
                        </div>
                    </div>
                </div>
            </div>
        `;
    });
    
    container.innerHTML = html;
}

function markNotificationRead(notificationId) {
    const csrftoken = getCookie('csrftoken');
    fetch(`{% url "notifications:mark_read" notification_id=0 %}`.replace('0', notificationId), {
        method: 'POST',
        headers: {
            'X-CSRFToken': csrftoken
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            loadNotifications();
        }
    })
    .catch(error => {
        console.error('Error marking notification as read:', error);
    });
}

function markAllNotificationsRead() {
    const csrftoken = getCookie('csrftoken');
    fetch('{% url "notifications:mark_all_read" %}', {
        method: 'POST',
        headers: {
            'X-CSRFToken': csrftoken
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            loadNotifications();
            // Reload page to update unread count in header
            window.location.reload();
        }
    })
    .catch(error => {
        console.error('Error marking all notifications as read:', error);
    });
}

function deleteNotification(notificationId) {
    if (!confirm('Are you sure you want to delete this notification?')) {
        return;
    }
    
    const csrftoken = getCookie('csrftoken');
    fetch(`{% url "notifications:delete_notification" notification_id=0 %}`.replace('0', notificationId), {
        method: 'POST',
        headers: {
            'X-CSRFToken': csrftoken
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            loadNotifications();
        }
    })
    .catch(error => {
        console.error('Error deleting notification:', error);
    });
}

// Load notifications on page load
document.addEventListener('DOMContentLoaded', function() {
    loadNotifications();
});
</script>
{% endblock %}
