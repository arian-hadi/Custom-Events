map $http_upgrade $frontend_connection {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    # Keep the public port for Django sessions, CSRF checks and Next HMR.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $frontend_connection;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # runserver serves the current static source; no collectstatic/rebuild is
    # needed while changing legacy templates, CSS or JavaScript.
    location /static/ {
        proxy_pass http://backend:8000;
        add_header X-Content-Type-Options nosniff always;
    }

    location /media/ {
        alias /app/mediafiles/;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    location ~ ^/(api|admin|accounts|dashboard|summernote|ckeditor5|editinghub|announcements|shop|terms|privacy|about|disclaimers|legacy)(/|$) {
        proxy_pass http://backend:8000;
    }

    location ~ ^/notifications/(api|unread-count|mark-all-read|[0-9]+/(read|delete))(/|$) {
        proxy_pass http://backend:8000;
    }

    location ~ ^/events/(events|create|add-fields|finish)(/|$) {
        proxy_pass http://backend:8000;
    }

    # Covers Next 16 /_next/hmr, including WebSocket upgrade requests.
    location / {
        proxy_pass http://frontend:3000;
    }
}
