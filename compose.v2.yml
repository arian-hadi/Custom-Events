name: platform-v2

x-backend: &backend
  image: platform-v2-backend:local
  build:
    context: ./prime_project
    dockerfile: Dockerfile.v2
  environment: &backend-environment
    DJANGO_SETTINGS_MODULE: prime_project.settings
    DJANGO_READ_ENV_FILE: "False"
    SECRET_KEY: ${SECRET_KEY:?Copy .env.v2.example to .env.v2 and set a local secret}
    DEBUG: "True"
    DATABASE_URL: postgres://${V2_DB_USER:-platform_v2}:${V2_DB_PASSWORD:?Set V2_DB_PASSWORD in .env.v2}@db:5432/${V2_DB_NAME:-platform_v2}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8082}
    V2_FRONTEND_URL: ${V2_FRONTEND_URL:-http://localhost:8082}
    CORS_ALLOW_ALL_ORIGINS: "False"
    SESSION_COOKIE_SECURE: "False"
    CSRF_COOKIE_SECURE: "False"
    SESSION_COOKIE_NAME: v2_sessionid
    CSRF_COOKIE_NAME: v2_csrftoken
    V2_TRUST_GATEWAY_ADDRESS: "True"
    ENABLE_EDITHUB_SCHEDULER: "False"
    LEAGUE_ENABLED: ${LEAGUE_ENABLED:-False}
    LEAGUE_YOUTUBE_API_KEY: ${LEAGUE_YOUTUBE_API_KEY:-}
    LEAGUE_PROVIDER_CREDENTIALS_FILE: ${LEAGUE_PROVIDER_CREDENTIALS_FILE:-}
    EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
    # Defaults capture locally; .env.v2 can explicitly select Gmail/other SMTP.
    EMAIL_HOST: ${EMAIL_HOST:-mailpit}
    EMAIL_PORT: "${EMAIL_PORT:-1025}"
    EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
    EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
    EMAIL_USE_TLS: "${EMAIL_USE_TLS:-False}"
    EMAIL_USE_SSL: "${EMAIL_USE_SSL:-False}"
    DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-website@platform-v2.test}
    SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@platform-v2.test}
    ADMIN_NOTIFICATION_RECIPIENTS: ${ADMIN_NOTIFICATION_RECIPIENTS:-}
    ADMIN_NOTIFICATION_BASE_URL: ${ADMIN_NOTIFICATION_BASE_URL:-http://localhost:8082}
    ADMIN_EMAIL_SEND_IMMEDIATELY: ${ADMIN_EMAIL_SEND_IMMEDIATELY:-True}
    MEMBER_EMAIL_ENABLED: ${MEMBER_EMAIL_ENABLED:-False}
    MEMBER_ACTIVITY_EMAIL_ENABLED: ${MEMBER_ACTIVITY_EMAIL_ENABLED:-False}
    MEMBER_EMAIL_BASE_URL: ${MEMBER_EMAIL_BASE_URL:-http://localhost:8082}
    MEMBER_EMAIL_POSTAL_ADDRESS: ${MEMBER_EMAIL_POSTAL_ADDRESS:-}
    STRIPE_CHECKOUT_ENABLED: ${STRIPE_CHECKOUT_ENABLED:-False}
    STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    STRIPE_ALLOW_LIVE_PAYMENTS: "False"
    STRIPE_CHECKOUT_BASE_URL: ${STRIPE_CHECKOUT_BASE_URL:-http://localhost:8082}
    AMAZON_AUTOMATION_ENABLED: ${AMAZON_AUTOMATION_ENABLED:-False}
    AMAZON_CREATORS_CLIENT_ID: ${AMAZON_CREATORS_CLIENT_ID:-}
    AMAZON_CREATORS_CLIENT_SECRET: ${AMAZON_CREATORS_CLIENT_SECRET:-}
    AMAZON_CREATORS_CREDENTIAL_VERSION: ${AMAZON_CREATORS_CREDENTIAL_VERSION:-3.1}
    AMAZON_PARTNER_TAG: ${AMAZON_PARTNER_TAG:-}
    AMAZON_MARKETPLACE: ${AMAZON_MARKETPLACE:-www.amazon.com}
    AMAZON_REFRESH_MINUTES: ${AMAZON_REFRESH_MINUTES:-45}
    AMAZON_HTTP_TIMEOUT: ${AMAZON_HTTP_TIMEOUT:-15}
    GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
    GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
    GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
    RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
    RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
    # The existing YouTube league adapter reads YOUTUBE_API_KEY.
    YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-${LEAGUE_YOUTUBE_API_KEY:-}}
    YOUTUBE_BLOG_CREDENTIALS_FILE: ${YOUTUBE_BLOG_CREDENTIALS_FILE:-}
  volumes:
    - v2_static:/app/staticfiles
    - v2_media:/app/mediafiles
    - ./.local-v2/secrets:/run/v2-secrets:ro

# Each job has one owner. Do not scale these services or also schedule the same
# commands on the host. Fresh command processes load code on every cycle.
x-job: &job
  <<: *backend
  init: true
  depends_on:
    migrate:
      condition: service_completed_successfully
    mailpit:
      condition: service_started
  restart: unless-stopped
  stop_grace_period: 30s
  healthcheck:
    test: [CMD, python, v2_worker.py, healthcheck, --heartbeat-file, /tmp/v2-worker.json, --max-age, "45"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${V2_DB_NAME:-platform_v2}
      POSTGRES_USER: ${V2_DB_USER:-platform_v2}
      POSTGRES_PASSWORD: ${V2_DB_PASSWORD:?Set V2_DB_PASSWORD in .env.v2}
    volumes:
      - v2_postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8026}:8025"
    restart: unless-stopped

  migrate:
    <<: *backend
    command: [python, v2_initialize.py]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend
    # One worker keeps the current in-memory throttles coherent. Configure a
    # shared cache before raising workers or replicating the backend.
    command: [gunicorn, prime_project.wsgi:application, --bind, "0.0.0.0:8000", --workers, "1", --threads, "4", --timeout, "60", --access-logfile, "-"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/api/v2/site/', headers={'Host': 'localhost'}), timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: platform-v2-frontend:local
    build:
      context: ./New_Frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  jobs-email:
    <<: *job
    command: [python, v2_worker.py, member-email, --interval, "${V2_EMAIL_INTERVAL_SECONDS:-60}", --timeout, "${V2_JOB_TIMEOUT_SECONDS:-600}"]

  jobs-admin-email:
    <<: *job
    command: [python, v2_worker.py, admin-email, --interval, "${V2_ADMIN_EMAIL_INTERVAL_SECONDS:-60}", --timeout, "${V2_JOB_TIMEOUT_SECONDS:-600}"]

  jobs-amazon:
    <<: *job
    command: [python, v2_worker.py, amazon, --interval, "${V2_AMAZON_INTERVAL_SECONDS:-900}", --timeout, "${V2_JOB_TIMEOUT_SECONDS:-600}"]

  jobs-league:
    <<: *job
    command: [python, v2_worker.py, league, --interval, "${V2_LEAGUE_INTERVAL_SECONDS:-60}", --timeout, "${V2_JOB_TIMEOUT_SECONDS:-600}"]

  jobs-youtube-blog:
    <<: *job
    command: [python, v2_worker.py, youtube-blog, --interval, "${V2_YOUTUBE_BLOG_INTERVAL_SECONDS:-300}", --timeout, "${V2_JOB_TIMEOUT_SECONDS:-600}"]

  gateway:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${V2_PORT:-8082}:80"
    volumes:
      - ./deploy/v2/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - v2_static:/app/staticfiles:ro
      - v2_media:/app/mediafiles:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  v2_postgres:
  v2_static:
  v2_media:
