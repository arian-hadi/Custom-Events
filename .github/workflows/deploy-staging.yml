name: Validate and prepare V2 staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the selected commit
        uses: actions/checkout@v4

      - name: Validate staging configuration and release source
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/staging/prepare-release.sh
          python3 -m unittest discover -s scripts -p test_staging_release.py -v
          docker compose --env-file .env.v2.staging.example -f compose.v2.staging.yml -p platform-v2-staging config --quiet
          archive="$RUNNER_TEMP/staging-v2-$GITHUB_SHA.tar"
          git archive --format=tar --output="$archive" "$GITHUB_SHA"
          bash deploy/staging/prepare-release.sh --validate-archive "$GITHUB_SHA" "$archive"

  prepare-v2:
    # A push validates only. Dispatch from staging after reviewing its commit.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging'
    needs: validate
    runs-on: ubuntu-latest
    environment: staging-v2
    concurrency:
      group: staging-v2-prepare
      cancel-in-progress: false
    steps:
      - name: Checkout the selected commit
        uses: actions/checkout@v4

      - name: Package the complete committed release
        shell: bash
        run: |
          set -euo pipefail
          upload_dir=".staging-v2-upload/$GITHUB_SHA"
          mkdir -p "$upload_dir"
          git archive --format=tar --output="$upload_dir/source.tar" "$GITHUB_SHA"
          bash deploy/staging/prepare-release.sh --validate-archive "$GITHUB_SHA" "$upload_dir/source.tar"
          cp deploy/staging/prepare-release.sh "$upload_dir/prepare-release.sh"

      - name: Upload the candidate to the separate V2 staging directory
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: ".staging-v2-upload/${{ github.sha }}/source.tar,.staging-v2-upload/${{ github.sha }}/prepare-release.sh"
          target: "/root/Custom-Events-Staging-V2/incoming/"
          strip_components: 1

      - name: Validate and build the isolated V2 candidate
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -eu
            bash "/root/Custom-Events-Staging-V2/incoming/${{ github.sha }}/prepare-release.sh" \
              "${{ github.sha }}" \
              "/root/Custom-Events-Staging-V2/incoming/${{ github.sha }}/source.tar"
