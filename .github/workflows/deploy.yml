name: Deploy to Hetzner VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "prime_project/"
          target: "/root/Custom-Events/"
          strip_components: 0

      - name: Deploy via SSH to Hetzner
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd /root/Custom-Events/prime_project
            echo "Current directory: $(pwd)"
            echo "Stopping any containers using port 8000..."
            docker ps --filter "publish=8000" --format "{{.ID}}" | xargs -r docker stop || true
            echo "Stopping existing production containers..."
            docker compose down || true
            echo "Building new images without cache..."
            docker compose build --no-cache web
            echo "Build successful! Now starting containers..."
            docker compose up -d
            echo "Cleaning up unused Docker resources..."
            docker system prune -f
            echo "Deployment completed successfully!"
